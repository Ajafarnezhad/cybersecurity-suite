services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      - FLASK_DEBUG=false
    volumes:
      - reports:/app/reports
      - logs:/app/logs

volumes:
  reports:
  logs:
